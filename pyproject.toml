[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigil-cli"
version = "1.5.3"
description = "Configuration driven CLI builder with subcommands and script loading"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kenzo Staelens", email = "kenzostael@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    'Environment :: Console',
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Typing :: Typed",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
completion = ["argcomplete>=3.0"]
dev = ["pytest", "pytest-cov", "ruff"]
# yaml = ["pyyaml>=6.0"]  # planned default for PEP 771

[project.urls]
Homepage = "https://github.com/kenzo-staelens/sigil"
Repository = "https://github.com/kenzo-staelens/sigil"
Issues = "https://github.com/kenzo-staelens/sigil/issues"

[project.scripts]
sigil = "sigil.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
omit = [
    "src/sigil/__main__.py",
    "src/sigil/datasource/json_source.py",  # nearly 1:1 with yml source
    "tests/*",
    "*/scripts/*"
]